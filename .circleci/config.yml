version: 2.1

jobs:
  check-emulator:
    machine:
      image: android:2023.10.1
    resource_class: large

    steps:
      - checkout

      - run:
          name: Accept licenses and install system image
          command: |
            export ANDROID_SDK_ROOT=$ANDROID_HOME
            mkdir -p "$ANDROID_SDK_ROOT/licenses"
            yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true

            sdkmanager \
              "platform-tools" \
              "emulator" \
              "platforms;android-30" \
              "system-images;android-30;google_apis;x86_64"

      - run:
          name: Create AVD
          command: |
            echo "no" | avdmanager create avd \
              -n test \
              -k "system-images;android-30;google_apis;x86_64" \
              --force

      - run:
          name: Start Emulator
          command: |
            emulator -avd test \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -gpu swiftshader_indirect &

      - run:
          name: Wait for Emulator
          command: |
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done;'
            echo "Emulator booted"

      - run:
          name: Check ADB Devices
          command: |
            adb devices
            if adb devices | grep -q "emulator"; then
              echo "Emulator is running ✅"
            else
              echo "Emulator NOT detected ❌"
              exit 1
            fi

workflows:
  version: 2
  test-emulator:
    jobs:
      - check-emulator